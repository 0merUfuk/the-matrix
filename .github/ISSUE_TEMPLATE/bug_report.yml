name: Bug Report
description: File a bug report for The Matrix (neo, morp, oracle, trinity, or matrixapp)
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        Please ensure your report does not contain sensitive personal tokens, private repository keys, or confidential prompts.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which tool or component is affected?
      options:
        - neo (orchestrator)
        - morp (service scaffolding & loop)
        - oracle (knowledge synthesis)
        - trinity (maintenance runtime)
        - matrixapp (browser UI dashboard)
        - cross-tool / build
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of The Matrix are you running? (Run `neo --version` or check Git commit)
      placeholder: v1.9.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Minimal commands or steps to reproduce the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Output or Logs
      description: Paste any command output, panic traces, or error messages.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, and Go version (e.g. macOS arm64, Ubuntu 24.04, Go 1.26.10).
      placeholder: macOS 15.0 arm64, Go 1.26.10, Homebrew install
    validations:
      required: true
