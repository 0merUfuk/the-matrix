version: 2

project_name: the-matrix

builds:
  - id: neo
    main: ./cmd/neo
    binary: neo
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

  - id: morp
    main: ./cmd/morp
    binary: morp
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

  - id: oracle
    main: ./cmd/oracle
    binary: oracle
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

  - id: trinity
    main: ./cmd/trinity
    binary: trinity
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

  - id: matrix
    main: ./cmd/matrix
    binary: matrix
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: neo
    builds: [neo]
    name_template: "neo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: morp
    builds: [morp]
    name_template: "morp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: oracle
    builds: [oracle]
    name_template: "oracle_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: trinity
    builds: [trinity]
    name_template: "trinity_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: matrix
    builds: [matrix]
    name_template: "matrix_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

brews:
  - name: neo
    ids: [neo]
    skip_upload: auto
    repository:
      owner: 0merUfuk
      name: homebrew-thematrix
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/0merUfuk/the-matrix
    description: Meta-CLI orchestrator for the-matrix agent ecosystem

  - name: morp
    ids: [morp]
    skip_upload: auto
    repository:
      owner: 0merUfuk
      name: homebrew-thematrix
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/0merUfuk/the-matrix
    description: Autonomous development infrastructure generator

  - name: oracle
    ids: [oracle]
    skip_upload: auto
    repository:
      owner: 0merUfuk
      name: homebrew-thematrix
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/0merUfuk/the-matrix
    description: Knowledge synthesis engine for any tech stack

  - name: trinity
    ids: [trinity]
    skip_upload: auto
    repository:
      owner: 0merUfuk
      name: homebrew-thematrix
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/0merUfuk/the-matrix
    description: Maintenance runtime for Claude Code agent ecosystems

  # The Matrix app: installing it installs the four tools too, and
  # `brew services start matrix` keeps it running for people who never open a terminal.
  - name: matrix
    ids: [matrix]
    skip_upload: auto
    repository:
      owner: 0merUfuk
      name: homebrew-thematrix
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/0merUfuk/the-matrix
    description: The Matrix app - set up and look after agent ecosystems from your browser
    dependencies:
      - name: neo
      - name: morp
      - name: oracle
      - name: trinity
    service: |
      run [opt_bin/"matrix", "--no-open"]
      keep_alive true
      log_path var/"log/matrix.log"
      error_log_path var/"log/matrix.log"

release:
  prerelease: auto

checksum:
  name_template: "checksums.txt"

changelog:
  use: github-native
